<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>АртАренда — Контакты</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <h1 class="header__logo">АртАренда</h1>
            <nav class="header__nav">
                <a href="index.html"    class="header__link">Главная</a>
                <a href="catalog.html"  class="header__link">Каталог</a>
                <a href="prices.html"   class="header__link">Цены</a>
                <a href="contacts.html" class="header__link header__link--active">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">Свяжитесь с нами</h2>

        <section class="contact-info">
            <p class="contact-info__item"><strong>Адрес:</strong> г. Самара, ул. Художников, д. 12</p>
            <p class="contact-info__item"><strong>Телефон:</strong> +7 (999) 123-45-67</p>
            <p class="contact-info__item">
                <strong>Email:</strong>
                <a href="mailto:info@artarenda.ru" class="link">info@artarenda.ru</a>
            </p>
            <p class="contact-info__item"><strong>Часы работы:</strong> Пн–Пт 10:00–20:00</p>
        </section>

        <h2 class="page-title">Оставить заявку</h2>

        <form class="rent-form" id="rentForm" novalidate>
            <div class="rent-form__field">
                <label class="rent-form__label" for="rf-name">Ваше имя</label>
                <input class="rent-form__input" type="text" id="rf-name" name="name"
                       placeholder="Иван Иванов" required minlength="2">
            </div>

            <div class="rent-form__field">
                <label class="rent-form__label" for="rf-email">Email</label>
                <input class="rent-form__input" type="email" id="rf-email" name="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="rent-form__field">
                <label class="rent-form__label" for="rf-phone">Телефон</label>
                <input class="rent-form__input" type="tel" id="rf-phone" name="phone"
                       placeholder="+7 999 123-45-67" required>
            </div>

            <div class="rent-form__field">
                <label class="rent-form__label" for="rf-duration">Срок аренды</label>
                <select class="rent-form__input" id="rf-duration" name="duration" required>
                    <option value="">— выберите —</option>
                    <option value="1w">1 неделя</option>
                    <option value="1m">1 месяц</option>
                    <option value="6m">6 месяцев</option>
                    <option value="1y">1 год</option>
                </select>
            </div>

            <label class="rent-form__checkbox">
                <input type="checkbox" name="consent" required>
                <span>Согласен на обработку персональных данных</span>
            </label>

            <button type="submit" class="button button--primary rent-form__submit">
                Отправить заявку
            </button>

            <p class="rent-form__status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 АртАренда. Все права защищены.</p>
    </footer>

    <script src="js/form.js"></script>
</body>
</html>
